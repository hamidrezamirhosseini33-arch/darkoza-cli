name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: darkoza-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
          - label: darwin-arm64
            runner: macos-15
            shell: bash
          - label: darwin-x64
            runner: macos-15-intel
            shell: bash
          - label: windows-x64
            runner: windows-2025
            shell: pwsh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Zig (Linux)
        if: startsWith(matrix.label, 'linux-')
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet ziglang==0.16.0
          ZIG_BIN=$(python3 -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')
          test -x "$ZIG_BIN"
          echo "ZIG=$ZIG_BIN" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native Darkoza binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.label }}" == linux-* ]]; then export ZIG="$ZIG"; fi
          KILO_VERSION="$version" bun run --cwd packages/opencode build --single --skip-install

      - name: Build native Darkoza binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $env:KILO_VERSION = $version
          bun run --cwd packages/opencode build --single --skip-install

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          src="packages/opencode/dist/@kilocode/cli-${{ matrix.label }}/bin"
          test -f "$src/kilo"
          mv "$src/kilo" "$src/darkoza"
          if [[ "${{ matrix.label }}" == linux-* ]]; then
            tar -C "$src" -czf "darkoza-${{ matrix.label }}-${version}.tar.gz" .
          else
            ditto -c -k --sequesterRsrc --keepParent "$src" "darkoza-${{ matrix.label }}-${version}.zip"
          fi

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $src = Join-Path 'packages/opencode/dist/@kilocode/cli-windows-x64/bin' ''
          $kilo = Join-Path $src 'kilo.exe'
          if (-not (Test-Path -LiteralPath $kilo)) { throw 'Missing compiled Darkoza binary' }
          Rename-Item -LiteralPath $kilo -NewName 'darkoza.exe'
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath "darkoza-windows-x64-$version.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkoza-${{ matrix.label }}
          path: |
            darkoza-*.tar.gz
            darkoza-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: darkoza-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test -n "$(find release-assets -maxdepth 1 -type f | head -1)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create --repo "$GITHUB_REPOSITORY" "${GITHUB_REF_NAME}" release-assets/* \
            --title "Darkoza CLI ${version}" \
            --generate-notes \
            --latest